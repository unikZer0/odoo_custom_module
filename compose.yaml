version: '3.1'
services:
  odoo:
    image: odoo:17
    depends_on:
      - db_custom
    restart: always
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - web-custom:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password

  db_custom:
    image: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - db-custom:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password
  flask:
      build: ./flask
      ports:
        - "5000:5000"
      restart: always

volumes:
  web-custom:
  db-custom:

secrets:
  postgresql_password:
    file: odoo_pg_pass
